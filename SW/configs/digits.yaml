general:
  name: Spiking_Heidelberg_Digits
  data_dir: /home/imperator/Datasets/hdspikes

  time_window: 1000000 # 1 second
  num_channels: 700 # number of frequency channels

preprocess:
  create_val: False
  val_split: 0.1

graph:
  time_radius: 20000
  channel_radius: 100
  skip_channels: 10
  features: global # local, global or None

train:
  batch_size: 4
  num_workers: 8
  num_epochs: 100
  lr: 0.0002
  weight_decay: 0.0001
  use_scheduler: True

model:
  num_classes: 20
  conv_channels: [72, 72, 72, 72]
  conv_bits: [16, 8, 8, 8]

  stem_channels: 72
  stem_bits: 8

  rnn_channels: 72
  rnn_bits: 8

  cls_linear_channels: 72
  cls_linear_bits: 8

  conf_linear_channels: 72
  conf_linear_bits: 8

  global_pooling: max # mean, max or add



